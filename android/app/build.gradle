plugins {
    id 'com.android.application'
}

// every build on github gets a higher version number, so phones install it as an update
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.deskplanner.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deskplanner.app'
        minSdk 29
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    // one fixed signing key, kept in this repo, so new builds install over old ones and keep your data
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
